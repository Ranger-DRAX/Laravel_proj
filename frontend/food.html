<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Pre-Order | Feastly</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
    }

    /* Background animation */
    .wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(120deg); }
      66% { transform: translate(-20px, 20px) rotate(240deg); }
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
    }

    .header h1 {
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f59e0b, #ef4444, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      animation: titleGlow 3s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from { filter: drop-shadow(0 0 20px rgba(251, 146, 60, 0.3)); }
      to { filter: drop-shadow(0 0 30px rgba(251, 146, 60, 0.6)); }
    }

    .subtitle {
      font-size: 1.2rem;
      color: #94a3b8;
      font-weight: 400;
    }

    /* Order Summary */
    .order-summary {
      position: sticky;
      top: 20px;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 40px;
      transition: all 0.3s ease;
    }

    .order-summary.has-items {
      transform: scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .summary-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .item-count {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .total-amount {
      font-size: 1.5rem;
      font-weight: 700;
      color: #10b981;
      text-align: center;
    }

    /* Cuisine Sections */
    .cuisine-section {
      margin-bottom: 60px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cuisine-title {
      font-size: 2rem;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 24px;
      position: relative;
      display: inline-block;
    }

    .cuisine-title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      border-radius: 2px;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    /* Food Cards */
    .card {
      position: relative;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
    }

    .card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      border-color: rgba(148, 163, 184, 0.3);
    }

    .card.selected {
      border: 2px solid #10b981;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
      transform: scale(1.05);
    }

    .card-image-container {
      position: relative;
      height: 200px;
      overflow: hidden;
      background: linear-gradient(135deg, #374151, #4b5563);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .selected-indicator {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #10b981;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s ease;
      z-index: 2;
    }

    .card.selected .selected-indicator {
      opacity: 1;
      transform: scale(1);
    }

    .card-content {
      padding: 24px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-price {
      font-size: 1.375rem;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 12px;
    }

    .card-description {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Confirm Button */
    .actions {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }

    #confirmFoodBtn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      padding: 16px 32px;
      color: #fff;
      font-weight: 600;
      border-radius: 50px;
      font-size: 1.125rem;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
      transition: all 0.3s ease;
      display: none;
      min-width: 200px;
      position: relative;
      overflow: hidden;
    }

    #confirmFoodBtn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    #confirmFoodBtn:hover::before {
      left: 100%;
    }

    #confirmFoodBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(16, 185, 129, 0.6);
    }

    #confirmFoodBtn:active {
      transform: translateY(0);
    }

    /* Loading State */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      font-size: 1.125rem;
      color: #94a3b8;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(148, 163, 184, 0.3);
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .wrapper {
        padding: 20px 16px;
      }

      .header h1 {
        font-size: 2.5rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .cuisine-title {
        font-size: 1.5rem;
      }

      .actions {
        bottom: 20px;
        left: 20px;
        right: 20px;
        transform: none;
      }

      #confirmFoodBtn {
        width: 100%;
      }
    }

    /* Smooth transitions for dynamic content */
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>Culinary Delights</h1>
    <p class="subtitle">Discover exceptional flavors from around the world</p>
  </div>

  <div class="order-summary" id="orderSummary">
    <div class="summary-header">
      <span class="summary-title">Your Order</span>
      <span class="item-count" id="itemCount">0 items</span>
    </div>
    <div class="total-amount" id="totalAmount">৳0</div>
  </div>

  <div id="grid"></div>
  
  <div class="actions">
    <button id="confirmFoodBtn">
      <i class="fas fa-check"></i>
      Confirm Order
    </button>
  </div>
</div>

<script>
const CUISINES=[
  {name:"Italian Classics",dishes:[
    {name:"Margherita Pizza",type:"Main",image:"https://images.pexels.com/photos/845811/pexels-photo-845811.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Fresh mozzarella, tomatoes, and basil on crispy crust"},
    {name:"Spaghetti Carbonara",type:"Main",image:"https://images.pexels.com/photos/4518843/pexels-photo-4518843.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Creamy pasta with pancetta, eggs, and parmesan"},
    {name:"Lasagna",type:"Main",image:"https://images.pexels.com/photos/4079520/pexels-photo-4079520.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Layered pasta with rich meat sauce and cheese"},
    {name:"Risotto Milanese",type:"Main",image:"https://images.pexels.com/photos/8753657/pexels-photo-8753657.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Creamy saffron risotto with parmesan"},
    {name:"Tiramisu",type:"Dessert",image:"https://images.pexels.com/photos/6880219/pexels-photo-6880219.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Coffee-soaked ladyfingers with mascarpone cream"}
  ]},
  {name:"American Favorites",dishes:[
    {name:"Gourmet Cheeseburger",type:"Main",image:"https://images.pexels.com/photos/1639557/pexels-photo-1639557.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Angus beef with aged cheddar and truffle aioli"},
    {name:"Buffalo Wings",type:"Appetizer",image:"https://images.pexels.com/photos/60616/fried-chicken-chicken-fried-crunchy-60616.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Crispy wings tossed in spicy buffalo sauce"},
    {name:"BBQ Ribs",type:"Main",image:"https://images.pexels.com/photos/539451/pexels-photo-539451.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Slow-cooked ribs with smoky barbecue glaze"},
    {name:"Truffle Mac & Cheese",type:"Side",image:"https://images.pexels.com/photos/718742/pexels-photo-718742.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Creamy cheese blend with truffle oil"},
    {name:"Apple Pie",type:"Dessert",image:"https://images.pexels.com/photos/265279/pexels-photo-265279.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Classic American pie with cinnamon and vanilla"}
  ]},
  {name:"Indian Spices",dishes:[
    {name:"Butter Chicken",type:"Main",image:"https://images.pexels.com/photos/2474661/pexels-photo-2474661.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Tender chicken in rich tomato cream sauce"},
    {name:"Biryani",type:"Main",image:"https://images.pexels.com/photos/12737659/pexels-photo-12737659.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Fragrant basmati rice with spiced meat"},
    {name:"Paneer Tikka",type:"Appetizer",image:"https://images.pexels.com/photos/5560763/pexels-photo-5560763.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Grilled cottage cheese with aromatic spices"},
    {name:"Masala Dosa",type:"Main",image:"https://images.pexels.com/photos/5560021/pexels-photo-5560021.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Crispy crepe filled with spiced potatoes"},
    {name:"Gulab Jamun",type:"Dessert",image:"https://images.pexels.com/photos/14675384/pexels-photo-14675384.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Sweet milk dumplings in rose syrup"}
  ]},
  {name:"Persian Delicacies",dishes:[
    {name:"Chelo Kebab",type:"Main",image:"https://images.pexels.com/photos/3763816/pexels-photo-3763816.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Grilled lamb with saffron rice and herbs"},
    {name:"Fesenjan",type:"Main",image:"https://images.pexels.com/photos/4552984/pexels-photo-4552984.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Pomegranate walnut stew with chicken"},
    {name:"Zereshk Polo",type:"Main",image:"https://images.pexels.com/photos/6305396/pexels-photo-6305396.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Saffron rice with barberries and chicken"},
    {name:"Kashk-e Bademjan",type:"Appetizer",image:"https://images.pexels.com/photos/5560034/pexels-photo-5560034.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Fried eggplant with whey and mint"},
    {name:"Sholeh Zard",type:"Dessert",image:"https://images.pexels.com/photos/4958792/pexels-photo-4958792.jpeg?auto=compress&cs=tinysrgb&w=800",desc:"Saffron rice pudding with rose water"}
  ]}
];

function updateOrderSummary() {
  const orderSummary = document.getElementById('orderSummary');
  const itemCount = document.getElementById('itemCount');
  const totalAmount = document.getElementById('totalAmount');
  const confirmBtn = document.getElementById('confirmFoodBtn');
  
  const total = selected.reduce((sum, item) => sum + item.price, 0);
  
  itemCount.textContent = `${selected.length} item${selected.length !== 1 ? 's' : ''}`;
  totalAmount.textContent = `৳${total.toLocaleString()}`;
  
  if (selected.length > 0) {
    orderSummary.classList.add('has-items');
    confirmBtn.style.display = 'inline-block';
  } else {
    orderSummary.classList.remove('has-items');
    confirmBtn.style.display = 'none';
  }
}

function buildMenu(){
  const grid = document.getElementById('grid');
  
  CUISINES.forEach((cuisine, index) => {
    const section = document.createElement('div');
    section.className = 'cuisine-section fade-in';
    section.style.animationDelay = `${index * 0.1}s`;
    
    const title = document.createElement('h2');
    title.className = 'cuisine-title';
    title.textContent = cuisine.name;
    section.appendChild(title);
    
    const subGrid = document.createElement('div');
    subGrid.className = 'grid';
    
    cuisine.dishes.forEach(dish => {
      const card = document.createElement('div');
      card.className = 'card';
      const price = dish.price ?? Math.floor(450 + Math.random() * 750);
      dish.price = price;
      
      card.innerHTML = `
        <div class="card-image-container">
          <span class='badge'>${dish.type}</span>
          <div class="selected-indicator">
            <i class="fas fa-check"></i>
          </div>
          <img loading='lazy' src='${dish.image}' alt='${dish.name}' onerror="this.style.display='none';" />
        </div>
        <div class="card-content">
          <div class='card-title'>${dish.name}</div>
          <div class='card-price'>৳${price.toLocaleString()}</div>
          <div class='card-description'>${dish.desc || ''}</div>
        </div>
      `;
      
      card.addEventListener('click', () => {
        if (card.classList.toggle('selected')) {
          selected.push(dish);
        } else {
          const index = selected.indexOf(dish);
          if (index > -1) selected.splice(index, 1);
        }
        updateOrderSummary();
      });
      
      subGrid.appendChild(card);
    });
    
    section.appendChild(subGrid);
    grid.appendChild(section);
  });
}

const params = new URLSearchParams(window.location.search);
const bookingId = params.get('bid');
if (!bookingId) {
  alert('Missing booking ID');
  window.location = 'explore.html';
}

const selected = [];
buildMenu();
updateOrderSummary();

function getToken() { return localStorage.getItem('token'); }

document.getElementById('confirmFoodBtn').addEventListener('click', async () => {
  if (selected.length === 0) return;
  
  const button = document.getElementById('confirmFoodBtn');
  const originalText = button.innerHTML;
  button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
  button.disabled = true;
  
  const amount = selected.reduce((sum, item) => sum + item.price, 0);
  const foods = JSON.stringify(selected);
  
  try {
    const res = await fetch(`http://127.0.0.1:8000/api/client-bookings/${bookingId}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
        'Authorization': 'Bearer ' + getToken()
      },
      body: JSON.stringify({ foods, amount })
    });
    
    if (!res.ok) throw new Error('Failed to save order');
    
    // Success animation
    // cache locally for receipt fallback
    localStorage.setItem(`foods_${bookingId}`,foods);
    localStorage.setItem(`amount_${bookingId}`,amount);
    button.innerHTML = '<i class="fas fa-check"></i> Order Confirmed!';
    setTimeout(() => {
      window.location.href = `payment.html?bid=${bookingId}`;
    }, 1000);
    
  } catch (e) {
    alert(e.message);
    button.innerHTML = originalText;
    button.disabled = false;
  }
});
</script>
</body>
</html>
